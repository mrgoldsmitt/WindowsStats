<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#06090e"/>
    </linearGradient>

    <!-- Ring Gradient Cyan -> Emerald -->
    <linearGradient id="cyanGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Accent Purple -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="rgba(6, 182, 212, 0.25)" stroke-width="2"/>

  <!-- Subtle Circuit / Tech Grid Pattern in Background -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="2">
    <path d="M 64,160 H 160 V 64"/>
    <path d="M 448,160 H 352 V 64"/>
    <path d="M 64,352 H 160 V 448"/>
    <path d="M 448,352 H 352 V 448"/>
    <circle cx="160" cy="160" r="4" fill="#06b6d4"/>
    <circle cx="352" cy="160" r="4" fill="#06b6d4"/>
    <circle cx="160" cy="352" r="4" fill="#06b6d4"/>
    <circle cx="352" cy="352" r="4" fill="#06b6d4"/>
  </g>

  <!-- Outer Gauge Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="22" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="188" transform="rotate(135 256 256)"/>

  <!-- Gauge Arc (Progress) Cyan to Emerald -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#cyanGreen)" stroke-width="22" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="360" transform="rotate(135 256 256)" filter="url(#glowCyan)"/>

  <!-- Pulse / Heartbeat Line in Center (Representing Realtime Monitor) -->
  <path d="M 120,270 L 180,270 L 210,210 L 245,320 L 280,180 L 315,290 L 340,270 L 392,270"
        fill="none" stroke="url(#cyanGreen)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glowPulse)"/>

  <!-- Modern BitAxe / Hardware Badge Center Top -->
  <rect x="196" y="96" width="120" height="28" rx="14" ry="14" fill="#111827" stroke="rgba(6, 182, 212, 0.4)" stroke-width="2"/>
  <circle cx="214" cy="110" r="5" fill="#10b981"/>
  <text x="232" y="115" font-family="ui-monospace, Consolas, monospace" font-size="13" font-weight="700" fill="#e2e8f0" letter-spacing="1">LIVE</text>

  <!-- Microchip Pins at Bottom -->
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round">
    <line x1="200" y1="410" x2="200" y2="435"/>
    <line x1="228" y1="410" x2="228" y2="445"/>
    <line x1="256" y1="410" x2="256" y2="450"/>
    <line x1="284" y1="410" x2="284" y2="445"/>
    <line x1="312" y1="410" x2="312" y2="435"/>
  </g>

  <!-- Typography "WindowsStats" Acronym WS -->
  <text x="256" y="380" font-family="ui-monospace, Consolas, monospace" font-size="28" font-weight="900" fill="#94a3b8" text-anchor="middle" letter-spacing="4">WINDOWSSTATS</text>

  <!-- Glowing Needle Accent Dot -->
  <circle cx="369" cy="143" r="11" fill="#10b981" filter="url(#glowPulse)"/>
  <circle cx="369" cy="143" r="6" fill="#ffffff"/>
</svg>
